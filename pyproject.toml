[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-action-chain"
version = "0.1.0"
description = "Audit requested, sent, and observed robot actions."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
robot-action-chain = "action_chain:main"

[tool.setuptools]
py-modules = ["action_chain"]
